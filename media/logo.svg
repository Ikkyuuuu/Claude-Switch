<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Claude Switch</title>
  <defs>
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#2D88FF"/>
      <stop offset="0.55" stop-color="#1877F2"/>
      <stop offset="1" stop-color="#0D5FCF"/>
    </linearGradient>
    <linearGradient id="arrows" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D88FF"/>
      <stop offset="1" stop-color="#1877F2"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#shine)"/>

  <!-- The account behind -->
  <g fill="#FFFFFF" fill-opacity="0.5">
    <circle cx="160" cy="86" r="27"/>
    <path d="M110 170c0-30 22-52 50-52s50 22 50 52v6H110z"/>
  </g>

  <!-- The account in front; the tile-coloured outline separates it from the one behind -->
  <g fill="#FFFFFF" stroke="url(#tile)" stroke-width="10" paint-order="stroke">
    <circle cx="100" cy="106" r="33"/>
    <path d="M42 206c0-34 26-60 58-60s58 26 58 60v8H42z"/>
  </g>

  <!-- Swap badge -->
  <circle cx="190" cy="186" r="42" fill="#FFFFFF" stroke="url(#tile)" stroke-width="10"/>
  <g fill="none" stroke="url(#arrows)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 174h40M200 163l11 11-11 11"/>
    <path d="M210 199h-40M180 188l-11 11 11 11"/>
  </g>
</svg>
